; ESP32 bay controller. Talks MQTT to the API on the bay's own topics, drives
; the pump relay, counts the session down locally (persisted to flash), and
; renders the rotating QR. See README.md.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    ricmoo/QRCode@^0.0.1
build_flags =
    -DUSE_TFT=0        ; set to 1 after configuring TFT_eSPI User_Setup
