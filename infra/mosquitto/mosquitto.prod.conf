# Production Mosquitto: authentication required (no anonymous access).
# Create the password file before first start (see DEPLOY.md):
#   docker run --rm -v "$PWD/infra/mosquitto:/m" eclipse-mosquitto:2 \
#     mosquitto_passwd -b -c /m/passwd api 'STRONG_API_PASSWORD'
#   docker run --rm -v "$PWD/infra/mosquitto:/m" eclipse-mosquitto:2 \
#     mosquitto_passwd -b /m/passwd bay-demo 'STRONG_BAY_PASSWORD'

per_listener_settings true
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Plaintext listener (username/password). Fine behind a trusted network or for
# a demo; prefer the TLS listener below for devices over the public internet.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd

# --- TLS listener (recommended for the ESP32 over the internet) ---
# Reuse the Let's Encrypt cert for your API subdomain (mount it in compose).
# listener 8883 0.0.0.0
# allow_anonymous false
# password_file /mosquitto/config/passwd
# cafile   /mosquitto/certs/chain.pem
# certfile /mosquitto/certs/fullchain.pem
# keyfile  /mosquitto/certs/privkey.pem
