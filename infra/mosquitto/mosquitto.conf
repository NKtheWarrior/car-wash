# Dev-only Mosquitto config.
# Production: disable anonymous, add a password_file with per-bay users, and
# enable TLS on 8883 (PRD §Security). For the local demo we keep it open.
listener 1883 0.0.0.0
allow_anonymous true

# MQTT over WebSockets (handy for debugging from a browser tool)
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
log_dest stdout
