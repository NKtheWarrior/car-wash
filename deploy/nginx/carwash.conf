# Nginx reverse proxy for the Car Wash stack. Install on the HOST (not in a
# container), then let certbot add TLS:
#
#   sudo cp deploy/nginx/carwash.conf /etc/nginx/sites-available/carwash.conf
#   sudo ln -s /etc/nginx/sites-available/carwash.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.com -d api.example.com
#
# certbot rewrites these port-80 blocks to add :443 + an HTTP->HTTPS redirect.
# Replace example.com / api.example.com with your real domain throughout.

# --- Customer + admin website (Next.js) ---
server {
    listen 80;
    server_name example.com www.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# --- API (Express) — note the SSE-friendly settings ---
server {
    listen 80;
    server_name api.example.com;

    # SSE streams (/admin/stream, /b/:id/stream) must not be buffered and
    # need a long read timeout so the connection stays open.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events.
        proxy_set_header Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
    }

    client_max_body_size 2m;
}
